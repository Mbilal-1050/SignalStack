<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#fff1f2"/><stop offset="1" stop-color="#f8fafc"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".13"/></filter></defs><rect width="1200" height="675" rx="28" fill="url(#b)"/><text x="70" y="80" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#dc2626" letter-spacing="3">PRODUCTIVITY TRAP</text><text x="70" y="125" font-family="Inter,Arial" font-size="40" font-weight="800" fill="#111827">When AI tools make you slower</text><text x="70" y="160" font-family="Inter,Arial" font-size="19" fill="#64748b">More tools can create more switching, checking and cleanup.</text><g filter="url(#s)"><rect x="75" y="215" width="650" height="325" rx="26" fill="#fff"/><rect x="765" y="215" width="360" height="325" rx="26" fill="#0f172a"/></g><text x="110" y="260" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#64748b">THE LOOP</text><g font-family="Inter,Arial"><circle cx="245" cy="375" r="78" fill="#fff1f2" stroke="#fecaca" stroke-width="3"/><text x="245" y="368" text-anchor="middle" font-size="18" font-weight="800" fill="#dc2626">PROMPT</text><text x="245" y="394" text-anchor="middle" font-size="14" fill="#64748b">again</text><circle cx="500" cy="300" r="78" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/><text x="500" y="293" text-anchor="middle" font-size="18" font-weight="800" fill="#334155">CHECK</text><text x="500" y="319" text-anchor="middle" font-size="14" fill="#64748b">output</text><circle cx="500" cy="455" r="78" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/><text x="500" y="448" text-anchor="middle" font-size="18" font-weight="800" fill="#334155">CLEAN UP</text><text x="500" y="474" text-anchor="middle" font-size="14" fill="#64748b">the mess</text><path d="M310 345l110-35M500 380v-2M430 450l-110-45" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/><path d="M405 302l20 8-17 12M490 402l10-20 10 20M325 395l-18 10 18 10" fill="none" stroke="#dc2626" stroke-width="4"/></g><text x="800" y="260" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#94a3b8">THE BETTER SIGNAL</text><text x="800" y="310" font-family="Inter,Arial" font-size="27" font-weight="800" fill="#fff">Less switching.</text><text x="800" y="345" font-family="Inter,Arial" font-size="27" font-weight="800" fill="#fff">More repeatability.</text><rect x="800" y="390" width="285" height="12" rx="6" fill="#334155"/><rect x="800" y="390" width="230" height="12" rx="6" fill="#16a34a"/><text x="800" y="445" font-family="Inter,Arial" font-size="15" fill="#94a3b8">Use AI where it removes a step,</text><text x="800" y="470" font-family="Inter,Arial" font-size="15" fill="#94a3b8">not where it adds one.</text></svg>