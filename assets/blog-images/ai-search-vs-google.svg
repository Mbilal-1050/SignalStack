<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eff6ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".12"/></filter></defs><rect width="1200" height="675" rx="28" fill="url(#g)"/><text x="70" y="78" font-family="Inter,Arial" font-size="23" font-weight="800" fill="#2563eb" letter-spacing="3">SEARCH EVOLUTION</text><text x="70" y="125" font-family="Inter,Arial" font-size="40" font-weight="800" fill="#111827">AI Search vs. traditional search</text><text x="70" y="160" font-family="Inter,Arial" font-size="19" fill="#64748b">One gives you a list of links. The other starts with an answer.</text><rect x="75" y="215" width="490" height="330" rx="26" fill="#fff" stroke="#dbe2ea" filter="url(#s)"/><rect x="635" y="215" width="490" height="330" rx="26" fill="#0f172a" filter="url(#s)"/><text x="110" y="265" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#334155">TRADITIONAL SEARCH</text><rect x="110" y="295" width="420" height="52" rx="15" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="140" cy="321" r="13" fill="none" stroke="#64748b" stroke-width="4"/><path d="M150 331l11 11" stroke="#64748b" stroke-width="4" stroke-linecap="round"/><text x="175" y="328" font-family="Inter,Arial" font-size="16" fill="#64748b">What should I choose?</text><rect x="110" y="375" width="420" height="13" rx="6" fill="#cbd5e1"/><rect x="110" y="407" width="350" height="10" rx="5" fill="#e2e8f0"/><rect x="110" y="432" width="390" height="10" rx="5" fill="#e2e8f0"/><rect x="110" y="457" width="310" height="10" rx="5" fill="#e2e8f0"/><text x="110" y="505" font-family="Inter,Arial" font-size="15" fill="#94a3b8">More links • more tabs • more synthesis</text><text x="670" y="265" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#fff">AI SEARCH</text><rect x="670" y="295" width="420" height="155" rx="18" fill="#172554" stroke="#334155"/><circle cx="710" cy="335" r="18" fill="#dbeafe"/><path d="M703 335l6 6 11-13" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/><text x="745" y="335" font-family="Inter,Arial" font-size="17" font-weight="700" fill="#fff">Direct answer</text><rect x="705" y="365" width="330" height="8" rx="4" fill="#475569"/><rect x="705" y="389" width="280" height="8" rx="4" fill="#475569"/><rect x="705" y="413" width="300" height="8" rx="4" fill="#475569"/><text x="670" y="490" font-family="Inter,Arial" font-size="15" fill="#94a3b8">Synthesis • citations • follow-up questions</text><path d="M570 380h55" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/><path d="M612 365l24 15-24 15" fill="none" stroke="#dc2626" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="595" text-anchor="middle" font-family="Inter,Arial" font-size="16" fill="#64748b">AI search shines when the question is complex, contextual or exploratory.</text></svg>