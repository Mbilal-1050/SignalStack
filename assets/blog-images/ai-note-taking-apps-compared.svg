<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff7ed"/><stop offset=".5" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-opacity=".12"/></filter></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/><circle cx="1040" cy="110" r="90" fill="#fee2e2"/><text x="70" y="80" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#dc2626" letter-spacing="3">PRODUCTIVITY LAB</text><text x="70" y="125" font-family="Inter,Arial" font-size="40" font-weight="800" fill="#111827">AI note-taking, compared</text><text x="70" y="160" font-family="Inter,Arial" font-size="19" fill="#64748b">Capture is easy. The real test is finding the right idea later.</text><g filter="url(#shadow)"><rect x="75" y="215" width="300" height="310" rx="22" fill="#fff"/><rect x="450" y="215" width="300" height="310" rx="22" fill="#fff"/><rect x="825" y="215" width="300" height="310" rx="22" fill="#fff"/></g><text x="110" y="255" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#0f172a">CAPTURE</text><rect x="110" y="280" width="230" height="120" rx="16" fill="#eff6ff"/><path d="M145 320h150M145 345h115M145 370h135" stroke="#64748b" stroke-width="8" stroke-linecap="round"/><circle cx="300" cy="305" r="18" fill="#2563eb"/><path d="M292 305h16M300 297v16" stroke="#fff" stroke-width="3" stroke-linecap="round"/><text x="110" y="435" font-family="Inter,Arial" font-size="15" fill="#64748b">Meetings, voice notes</text><text x="110" y="462" font-family="Inter,Arial" font-size="15" fill="#64748b">and quick thoughts.</text><text x="485" y="255" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#0f172a">UNDERSTAND</text><rect x="485" y="280" width="230" height="120" rx="16" fill="#fff1f2"/><circle cx="545" cy="340" r="34" fill="#fee2e2"/><path d="M530 340h30M545 325v30" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/><path d="M600 315h80M600 340h95M600 365h65" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/><text x="485" y="435" font-family="Inter,Arial" font-size="15" fill="#64748b">Summaries, topics</text><text x="485" y="462" font-family="Inter,Arial" font-size="15" fill="#64748b">and action items.</text><text x="860" y="255" font-family="Inter,Arial" font-size="18" font-weight="800" fill="#0f172a">RETRIEVE</text><rect x="860" y="280" width="230" height="120" rx="16" fill="#f0fdf4"/><circle cx="915" cy="330" r="25" fill="none" stroke="#16a34a" stroke-width="7"/><path d="M934 349l22 22" stroke="#16a34a" stroke-width="7" stroke-linecap="round"/><path d="M965 320h85M965 345h60" stroke="#64748b" stroke-width="7" stroke-linecap="round"/><text x="860" y="435" font-family="Inter,Arial" font-size="15" fill="#64748b">Search the exact idea</text><text x="860" y="462" font-family="Inter,Arial" font-size="15" fill="#64748b">when you need it.</text><text x="600" y="590" text-anchor="middle" font-family="Inter,Arial" font-size="16" fill="#64748b">Compare tools by workflow, not by feature count.</text></svg>