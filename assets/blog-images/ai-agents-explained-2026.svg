<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#fdf2f8"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".13"/></filter></defs><rect width="1200" height="675" rx="28" fill="url(#b)"/><text x="70" y="80" font-family="Inter,Arial" font-size="22" font-weight="800" fill="#db2777" letter-spacing="3">AI AGENTS</text><text x="70" y="125" font-family="Inter,Arial" font-size="40" font-weight="800" fill="#111827">What AI agents actually do</text><text x="70" y="160" font-family="Inter,Arial" font-size="19" fill="#64748b">They turn a goal into a sequence of actions, tools and decisions.</text><rect x="75" y="210" width="1050" height="345" rx="28" fill="#fff" filter="url(#s)"/><circle cx="600" cy="380" r="82" fill="#111827"/><circle cx="600" cy="380" r="56" fill="#fce7f3"/><circle cx="580" cy="365" r="7" fill="#db2777"/><circle cx="620" cy="365" r="7" fill="#db2777"/><path d="M575 395q25 24 50 0" fill="none" stroke="#db2777" stroke-width="6" stroke-linecap="round"/><g font-family="Inter,Arial"><rect x="120" y="270" width="250" height="75" rx="18" fill="#f8fafc" stroke="#e2e8f0"/><text x="145" y="302" font-size="15" font-weight="800" fill="#64748b">1 · PLAN</text><text x="145" y="326" font-size="16" fill="#0f172a">Break goal into steps</text><rect x="830" y="270" width="250" height="75" rx="18" fill="#f8fafc" stroke="#e2e8f0"/><text x="855" y="302" font-size="15" font-weight="800" fill="#64748b">2 · USE TOOLS</text><text x="855" y="326" font-size="16" fill="#0f172a">Search, code, browse</text><rect x="120" y="440" width="250" height="75" rx="18" fill="#f8fafc" stroke="#e2e8f0"/><text x="145" y="472" font-size="15" font-weight="800" fill="#64748b">3 · CHECK</text><text x="145" y="496" font-size="16" fill="#0f172a">Inspect results &amp; errors</text><rect x="830" y="440" width="250" height="75" rx="18" fill="#f8fafc" stroke="#e2e8f0"/><text x="855" y="472" font-size="15" font-weight="800" fill="#64748b">4 · ACT</text><text x="855" y="496" font-size="16" fill="#0f172a">Continue until done</text></g><path d="M370 308h140M690 308h140M370 478h140M690 478h140" stroke="#db2777" stroke-width="4" stroke-linecap="round"/><text x="600" y="600" text-anchor="middle" font-family="Inter,Arial" font-size="16" fill="#64748b">Automation becomes powerful when the agent can reason, act and recover.</text></svg>